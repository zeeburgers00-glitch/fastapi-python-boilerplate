[project]
name = "youtube-ai-factory"
version = "0.3.0"
description = "Local-first YouTube video production backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
    "Pillow>=10,<13",
    "edge-tts>=7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
